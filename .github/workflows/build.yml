name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build runIntegrationTest
      - uses: actions/upload-artifact@v4
        with:
          name: Zombie-Apocalipse-Plus-Plus
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: |
            build/reports/tests/
            build/integration-server/logs/
