plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = project.mod_version
group = project.group_id
base { archivesName = 'zombie-apocalipse-plus-plus-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.integrationTest
    mods {
        zpp { sourceSet sourceSets.main }
        zpp_integration { sourceSet sourceSets.integrationTest }
    }
    runs {
        client {
            client()
            loadedMods = [mods.zpp]
        }
        integrationTest {
            server()
            sourceSet = sourceSets.integrationTest
            gameDirectory = file('build/integration-server')
            programArgument '--nogui'
            loadedMods = [mods.zpp, mods.zpp_integration]
        }
        server {
            server()
            loadedMods = [mods.zpp]
            programArgument '--nogui'
        }
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar { from('LICENSE') { rename { "${it}_ZPP" } } }

tasks.named('runIntegrationTest') {
    doFirst {
        def dir = file('build/integration-server')
        delete file('build/integration-server/world'), file('build/integration-server/PASSED.txt'), file('build/integration-server/FAILED.txt'), file('build/integration-server/config/zpp-presets.json')
        dir.mkdirs()
        file('build/integration-server/eula.txt').text = 'eula=true\n'
        file('build/integration-server/server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
view-distance=3
simulation-distance=3
spawn-protection=0
max-tick-time=120000
'''
    }
    doLast {
        def result = file('build/integration-server/PASSED.txt')
        if (!result.exists()) throw new GradleException('ZPP integration tests failed; see build/integration-server/logs/latest.log')
        logger.lifecycle(result.text.trim())
    }
}
